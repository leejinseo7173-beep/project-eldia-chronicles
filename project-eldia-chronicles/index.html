<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엘디아 연대기: 여명의 맹세</title>
<link rel="icon" href="data:,">
<style>
  /* Galmuri — 동봉 무료 한글 픽셀 폰트 (SIL OFL) */
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11-Bold.woff2') format('woff2');
    font-weight: bold;
    font-display: swap;
  }
  @font-face {
    font-family: 'Galmuri9';
    src: url('assets/fonts/Galmuri9.woff2') format('woff2');
    font-display: swap;
  }
  html, body {
    margin: 0; padding: 0;
    background: #0d0b14;
    height: 100%;
    overflow: hidden;
    user-select: none;
  }
  #game-root {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: default;
  }
</style>
</head>
<body>
<div id="game-root"><canvas id="game" width="960" height="540"></canvas></div>
<script>
// index.html을 파일로 직접 열면(file://) ES 모듈이 차단되어 게임이 뜨지 않는다 — 안내 표시
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
      + 'background:#0d0b14;color:#f2ecdd;font-family:"Malgun Gothic",sans-serif;text-align:center;'
      + 'line-height:1.9;z-index:10;padding:20px;';
    d.innerHTML = '<div><h2 style="color:#f2d251;margin-bottom:12px">게임을 이 방식으로는 열 수 없습니다</h2>'
      + 'index.html을 더블클릭해 열면 브라우저 보안 정책 때문에 게임이 로드되지 않습니다.<br>'
      + '프로젝트 폴더의 <b style="color:#f2d251">게임실행.bat</b>을 더블클릭하거나, 터미널에서<br>'
      + '<code style="color:#7fdde8">python -m http.server 3005</code> 실행 후 '
      + '<code style="color:#7fdde8">http://localhost:3005</code> 으로 접속하세요.</div>';
    document.body.appendChild(d);
  });
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
